[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "modelfile-doctor"
version = "0.1.0"
description = "Check an Ollama Modelfile against the GGUF metadata it points to, before you run `ollama create`."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "LeeGyeongPil" }]
keywords = ["ollama", "modelfile", "gguf", "lint", "chat-template", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/LeeGyeongPil/modelfile-doctor"
Issues = "https://github.com/LeeGyeongPil/modelfile-doctor/issues"

[project.scripts]
modelfile-doctor = "modelfile_doctor.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "gguf==0.19.0",
  "numpy==2.5.4; python_version >= '3.12'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/modelfile_doctor"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "README.ko.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: talks to a real local Ollama server (needs MODELFILE_DOCTOR_LIVE=1)"]
addopts = "-q"
